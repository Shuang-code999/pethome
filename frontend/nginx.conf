# 萌宠之家 前端 nginx：托管 SPA 静态 + 反代 /api 到 backend 容器
# 坑2 修复：开 backend 的 forward-headers 后，图片 toAbsoluteUrl 能拼成 https+真实域名

server {
    listen 80;
    server_name _;
    # 如果有域名 + 证书，把 listen 换成 443 ssl 并取消下面注释：
    # ssl_certificate     /etc/nginx/cert/fullchain.pem;
    # ssl_certificate_key /etc/nginx/cert/privkey.pem;
    # 并在 80 端口加一个 server { listen 80; return 301 https://$host$request_uri; }

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # ---------- gzip ----------
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;
    gzip_vary on;

    # ---------- 静态资源长缓存 ----------
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- SSE：必须关缓冲，否则流式被卡成一坨 ----------
    # consult 流式 + 悬浮客服流式（正则 location 优先级高于前缀 location）
    location ~ ^/api/(consult/sessions/.*/stream|customer-service/stream)(/|$) {
        proxy_pass http://backend:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding on;
        # Nginx 自己也别缓冲
        add_header X-Accel-Buffering no;
    }

    # ---------- 普通 /api 接口 ----------
    location /api/ {
        proxy_pass http://backend:8088;     # 不加尾斜杠：保留 /api 前缀，匹配后端 context-path
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 透传 Cloudflare 真实客户端 IP（cloudflared tunnel 会带此头）
        proxy_set_header Cf-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Connection "";
        client_max_body_size 20m;            # 图片上传上限
        proxy_read_timeout 60s;
    }

    # ---------- SPA 路由兜底 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
